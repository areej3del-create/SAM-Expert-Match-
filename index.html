<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM Expert Match</title>
<meta name="description" content="SAM: an AI agent that analyses a cultural project's needs and matches the entrepreneur with the right experts and technical talent.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* SAM Expert Match. Layout idea: one composer, then a two-column workspace:
   the agent's visible trace beside the results it produces. Single dark theme by choice
   (SAM brand): orange = heritage, lavender = change. */
:root{
  color-scheme:dark;
  --bg:#070608; --panel:#111015; --panel2:#17151c; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --text:#f6f3ee; --muted:#a9a4af; --faint:#77727d;
  --orange:#ff9d4d; --amber:#ffc890; --lav:#b8a6ff; --cream:#f3e7d6;
  --ok:#7fe0b0; --warn:#ffcf70;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --grad:linear-gradient(100deg,#ffb877 0%,#ffd9b5 40%,#c9bbff 100%);
  --r:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.7;overflow-x:hidden;min-height:100vh}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 18% 12%,rgba(255,157,77,.16),transparent 28%),radial-gradient(circle at 85% 8%,rgba(184,166,255,.15),transparent 28%),radial-gradient(circle at 60% 90%,rgba(143,124,240,.09),transparent 30%);filter:blur(30px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--amber)}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.35}
[dir=ltr] h1,[dir=ltr] h2{letter-spacing:-.02em;line-height:1.15}
p{margin:0}
.wrap{width:min(100% - 32px,1180px);margin-inline:auto}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.top{position:sticky;top:12px;z-index:30;margin-top:12px}
.bar{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;padding-inline:14px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(14,13,18,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 16px 50px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#0b0809;background:linear-gradient(145deg,#ffe3c7,#ff9d4d 50%,#b8a6ff);direction:ltr}
.tabs{display:flex;gap:2px;margin-inline:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:#c9c5cf;font-size:14px;padding:8px 14px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
.tabs button.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.tabs .count{font-size:11px;background:var(--orange);color:#120a04;border-radius:999px;padding:1px 7px;margin-inline-start:6px;font-weight:700}
.chipbtn{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chipbtn:hover{border-color:var(--line2)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.live i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status.demo i{background:var(--warn)}

/* ---------- Views ---------- */
.view{display:none;padding:34px 0 80px}
.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;color:var(--amber);font-weight:600;margin-bottom:10px}
.lead{color:var(--muted);max-width:62ch}

/* ---------- Composer ---------- */
.hero{padding:26px 0 8px;max-width:820px}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:700}
.hero .lead{margin-top:14px;font-size:17px}
.composer{margin-top:24px;border:1px solid var(--line2);border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.03));padding:14px;box-shadow:0 30px 90px rgba(0,0,0,.35);transition:border-color .25s}
.composer:focus-within{border-color:rgba(255,157,77,.65)}
.composer textarea{display:block;width:100%;min-height:104px;resize:vertical;border:0;background:none;outline:none;padding:10px 12px;font-size:17px;line-height:1.75}
.composer textarea::placeholder{color:var(--faint)}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 4px 2px}
.crow .sp{margin-inline-start:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;background:#f6f2ec;color:#0b0909;transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(255,190,130,.22)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:linear-gradient(120deg,#ffd0a3,#ff9d4d 55%,#c3b3ff)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);display:grid;place-items:center}
.icon.rec{background:rgba(255,90,90,.18);border-color:rgba(255,120,120,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,100,100,.12)}}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.switch input{accent-color:var(--orange);width:16px;height:16px}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.examples button{text-align:start;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:16px;padding:10px 14px;font-size:14px;color:#d6d2da;max-width:360px;line-height:1.6}
.examples button:hover{border-color:rgba(184,166,255,.55);color:#fff}
.examples b{display:block;color:var(--lav);font-size:12px;font-weight:600}
.note{font-size:13px;color:var(--faint);margin-top:12px}

/* ---------- Workspace ---------- */
.work{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-top:30px;align-items:start}
.panel{border:1px solid var(--line);border-radius:var(--r);background:rgba(17,16,21,.82);padding:20px}
.trace{position:sticky;top:78px}
.trace h3{font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.steps{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:4px}
.stepi{position:relative;padding:0 0 14px;padding-inline-start:30px}
.stepi:before{content:"";position:absolute;inset-inline-start:8px;top:20px;bottom:0;width:1px;background:var(--line)}
.stepi:last-child:before{display:none}
.dot{position:absolute;inset-inline-start:0;top:4px;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:10px;color:#0b0809}
.stepi.run .dot{border-color:var(--orange);border-top-color:transparent;animation:spin .8s linear infinite}
.stepi.done .dot{background:var(--ok);border-color:var(--ok)}
.stepi.done .dot:after{content:"✓";font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}
.stepi b{font-weight:600;font-size:14.5px;color:var(--muted)}
.stepi.run b,.stepi.done b{color:var(--text)}
.logs{margin-top:6px;display:grid;gap:5px}
.log{font-family:var(--mono);font-size:11.5px;line-height:1.55;color:#bdb8c4;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:6px 9px;direction:ltr;text-align:left;overflow-wrap:anywhere;animation:fade .3s ease}
.log em{font-style:normal;color:var(--amber)}
.log span{color:var(--ok)}
.results{display:grid;gap:18px;min-width:0}
.brief h2{font-size:24px}
.brief p{color:var(--muted);margin-top:8px;max-width:68ch}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.tag{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:#d0ccd5;background:rgba(255,255,255,.03);white-space:nowrap}
.tag.o{border-color:rgba(255,157,77,.45);color:#ffd9b8}
.tag.l{border-color:rgba(184,166,255,.45);color:#e0d8ff}
.tag.dash{border-style:dashed;color:var(--amber);border-color:rgba(255,157,77,.5)}
.summary{border-inline-start:2px solid var(--orange);padding-inline-start:14px;margin-top:16px;color:#e4e0e8}
.needs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.need{text-align:start;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035);padding:16px;transition:border-color .2s,background .2s;display:flex;flex-direction:column;gap:6px}
.need:hover{border-color:var(--line2)}
.need.on{border-color:rgba(255,157,77,.7);background:rgba(255,157,77,.08)}
.need small{font-size:12px;color:var(--amber);font-weight:600}
.need h4{font-size:16px}
.need p{font-size:13.5px;color:var(--muted);line-height:1.65}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sech h3{font-size:19px}
.sech span{font-size:13px;color:var(--faint)}
.matches{display:grid;gap:14px}
.mcard{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.02));padding:20px;display:grid;grid-template-columns:1fr 190px;gap:20px;animation:fade .4s ease}
.mcard.top{border-color:rgba(255,157,77,.5)}
.who{display:flex;gap:14px;align-items:flex-start}
.ava{flex:none;width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:19px;color:#0b0809;background:linear-gradient(145deg,#ffd9b5,#b8a6ff)}
.ava.t{background:linear-gradient(145deg,#d8ceff,#ffb877)}
.who h4{font-size:18px}
.who .role{color:var(--muted);font-size:14.5px}
.why{margin-top:14px}
.why b,.watch b{display:block;font-size:12.5px;color:var(--lav);font-weight:600;margin-bottom:2px}
.why p{font-size:15px;color:#ece8f0}
.watch{margin-top:10px;font-size:13.5px;color:#d8d2c4}
.watch b{color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:13px;color:var(--muted)}
.meta span:before{content:"·";margin-inline-end:14px;color:var(--faint)}
.meta span:first-child:before{display:none}
.mact{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.scorebox{border-inline-start:1px solid var(--line);padding-inline-start:20px;display:flex;flex-direction:column;gap:10px}
.ring{--p:80;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--orange) 0,var(--lav) calc(var(--p)*1%),rgba(255,255,255,.08) 0);position:relative}
.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel2)}
.ring b{position:relative;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;direction:ltr}
.ring b small{font-size:11px;color:var(--faint)}
.fitrow{font-size:12px;color:var(--muted)}
.fitrow div{display:flex;justify-content:space-between;gap:8px}
.fitrow div b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
.track{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:3px}
.track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--orange),var(--lav))}
[dir=rtl] .track i{background:linear-gradient(270deg,var(--orange),var(--lav))}
.scorenote{font-size:11px;color:var(--faint);line-height:1.5}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:26px;color:var(--muted);text-align:center}
.banner{border:1px solid rgba(255,207,112,.4);background:rgba(255,207,112,.07);color:#f1e2bd;border-radius:14px;padding:10px 14px;font-size:14px}

/* ---------- Directory ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.filters input,.filters select,.form input,.form select,.form textarea{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:9px 12px;outline:none;min-width:0}
.filters input{flex:1;min-width:200px}
.filters input:focus,.filters select:focus,.form input:focus,.form select:focus,.form textarea:focus{border-color:rgba(255,157,77,.6)}
select option{background:#17151c}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.dcard{border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.035);padding:18px;display:flex;flex-direction:column;gap:10px}
.dcard .who h4{font-size:16px}
.dcard p{font-size:13.5px;color:var(--muted);line-height:1.65}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.form label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.form .full{grid-column:1/-1}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:5px 11px;font-size:13px;color:#cfcbd4}
.pick button.on{border-color:rgba(184,166,255,.7);background:rgba(184,166,255,.15);color:#fff}

/* ---------- Requests & how ---------- */
.req{border:1px solid var(--line);border-radius:18px;padding:16px 18px;background:rgba(255,255,255,.035);display:grid;gap:8px}
.req pre{white-space:pre-wrap;font-family:var(--body);font-size:14px;color:#d9d5de;margin:0;background:rgba(0,0,0,.25);border-radius:12px;padding:12px}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:22px}
.pnode{border:1px solid var(--line);border-radius:18px;padding:16px;background:rgba(255,255,255,.035);position:relative}
.pnode small{color:var(--amber);font-size:12px;font-weight:600}
.pnode h4{font-size:15.5px;margin:6px 0 4px}
.pnode p{font-size:13px;color:var(--muted);line-height:1.6}
.pnode code{font-family:var(--mono);font-size:11px;color:var(--lav);direction:ltr;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;margin-top:16px}
th,td{text-align:start;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:600;font-size:13px;color:var(--amber);background:rgba(255,255,255,.03)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;white-space:nowrap}
td{color:#d9d5de}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.stat b{font-family:var(--display);font-size:34px;display:block;line-height:1.2;direction:ltr;text-align:start}
[dir=rtl] .stat b{text-align:right}
.stat p{font-size:14px;color:var(--muted);margin-top:6px}
.stat a{font-size:12px}
.sec{margin-top:44px}
.sec>h2{font-size:26px}
.sec>.lead{margin-top:8px}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;backdrop-filter:blur(3px)}
.scrim.on{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(520px,100%);z-index:51;background:#121117;border-inline-start:1px solid var(--line2);padding:24px;overflow-y:auto;transform:translateX(105%);transition:transform .3s ease;display:flex;flex-direction:column;gap:14px}
[dir=rtl] .drawer{transform:translateX(-105%)}
.drawer.on{transform:none}
.drawer textarea{width:100%;min-height:210px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:14px;padding:14px;outline:none;line-height:1.8;resize:vertical}
.drawer ol{margin:0;padding-inline-start:20px;color:#ddd9e2;font-size:14.5px;display:grid;gap:4px}
.toast{position:fixed;bottom:22px;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:60;background:#f6f2ec;color:#0b0909;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:none}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--faint);font-size:13px}

@media(max-width:940px){
  .work{grid-template-columns:1fr}.trace{position:static}
  .mcard{grid-template-columns:1fr}.scorebox{border:0;padding:0;border-top:1px solid var(--line);padding-top:16px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .scorebox .fitrow{flex:1;min-width:130px}.scorenote{flex-basis:100%}
  .pipe{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}
  .status span{display:none}.status{padding:8px}
}
@media(max-width:560px){
  .bar{flex-wrap:wrap;border-radius:22px}.tabs{order:3;flex-basis:100%;margin:0}
  .brand{margin-inline-end:auto}
  .form{grid-template-columns:1fr}.pipe{grid-template-columns:1fr}
  .composer textarea{font-size:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap top">
  <div class="bar">
    <div class="brand"><span class="mark">SAM</span><span data-i="brand"></span></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-view="match" class="on" data-i="tabMatch"></button>
      <button data-view="directory" data-i="tabDir"></button>
      <button data-view="requests"><span data-i="tabReq"></span><span class="count hidden" id="reqCount"></span></button>
      <button data-view="how" data-i="tabHow"></button>
    </nav>
    <span class="status demo" id="status"><i></i><span id="statusTxt"></span></span>
    <button class="chipbtn" id="langBtn" aria-label="Switch language"></button>
  </div>
</div>

<main class="wrap">
<!-- ================= Match ================= -->
<section class="view on" id="v-match">
  <div class="hero">
    <div class="eyebrow" data-i="heroEyebrow"></div>
    <h1><span class="grad" data-i="heroH1"></span></h1>
    <p class="lead" data-i="heroLead"></p>
  </div>
  <div class="composer" style="max-width:820px">
    <label class="hidden" for="ask" data-i="askLabel"></label>
    <textarea id="ask" maxlength="1200"></textarea>
    <div class="crow">
      <button class="icon hidden" id="mic" type="button" title="Voice">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <label class="switch" id="deepWrap"><input type="checkbox" id="deep"><span data-i="deep"></span></label>
      <span class="sp"></span>
      <button class="btn ghost hidden" id="stopBtn" type="button" data-i="stop"></button>
      <button class="btn primary" id="runBtn" type="button" data-i="run"></button>
    </div>
  </div>
  <div class="examples" id="examples"></div>
  <p class="note" id="modeNote"></p>

  <div class="work hidden" id="work">
    <aside class="panel trace">
      <h3><span data-i="traceH"></span><span class="tag dash" id="traceMode"></span></h3>
      <ol class="steps" id="steps"></ol>
    </aside>
    <div class="results" id="results"></div>
  </div>
</section>

<!-- ================= Directory ================= -->
<section class="view" id="v-directory">
  <div class="eyebrow" data-i="dirEyebrow"></div>
  <h2 style="font-size:32px" data-i="dirH"></h2>
  <p class="lead" style="margin-top:8px" data-i="dirLead"></p>
  <div class="filters">
    <input id="dq" type="search" autocomplete="off">
    <select id="dkind" aria-label="Type"></select>
    <select id="dskill" aria-label="Skill"></select>
    <button class="btn ghost sm" id="joinToggle" data-i="joinBtn"></button>
  </div>
  <div class="panel hidden" id="joinPanel" style="margin-bottom:18px">
    <h3 data-i="joinH"></h3>
    <p class="note" style="margin-top:4px" data-i="joinNote"></p>
    <form class="form" id="joinForm">

/* ---------------- Retrieval and scoring (deterministic, explainable) ---------------- */
function fit(e, need, brief){
  const alt = need.alt || [];
  const sk = e.s.includes(need.skill) ? 100 : alt.some(x => e.s.includes(x)) ? 65 : 20;
  const sec = e.c.includes(brief.sector) ? 100 : e.c.includes('all') ? 80 : 40;
  const near = e.r === brief.region;
  const reg = e.m === 'onsite' ? (near ? 100 : brief.region === 'unknown' ? 70 : 45) : (near ? 100 : 85);
  const prac = Math.round(reg * .6 + ({1:55,2:80,3:100}[e.a] || 70) * .4);
  let total = Math.round(.5*sk + .3*sec + .2*prac);
  if (need.kind && need.kind !== 'any' && need.kind !== e.k) total -= 5;
  return {sk, sec, prac, total: Math.max(0, total)};
}
function retrieve(need, brief){
  return allExperts().map(e => ({e, f: fit(e, need, brief)})).filter(x => x.f.sk >= 65).sort((a,b) => b.f.total - a.f.total);
}
function localWatch(e, brief){
  if (e.m === 'onsite' && e.r !== brief.region) return T().wRegion(L(REGIONS[e.r]));
  if (e.a === 1) return T().wAvail;
  if (!e.c.includes(brief.sector) && !e.c.includes('all')) return T().wSector;
  return '';
}
const localWhy = (e, need, brief) => T().localWhy(e.y, L(SKILLS[need.skill]), L(SECTORS[e.c.includes(brief.sector) ? brief.sector : e.c[0]]) || L(SECTORS[brief.sector]));

function localAnalyse(text){
  const t = text.toLowerCase();
  const first = (map) => Object.entries(map).map(([k, ws]) => [k, Math.min(...ws.map(w => { const i = t.indexOf(w); return i < 0 ? 1e9 : i }))]).filter(x => x[1] < 1e9).sort((a,b) => a[1]-b[1]).map(x => x[0]);
  let skills = first(KW).slice(0, 4);
  if (!skills.length) skills = ['brand','marketing'];
  const sector = first(SECKW)[0] || 'crafts', region = first(REGKW)[0] || 'unknown';
  const short = text.trim().replace(/\s+/g,' ');
  return {
    brief:{title:L(SECTORS[sector]), summary: short.length > 190 ? short.slice(0,190) + '…' : short, sector, stage:'early', region},
    needs: skills.map((s,i) => ({id:'n'+(i+1), skill:s, title:L(SKILLS[s]), why:T().localNeedWhy(L(SKILLS[s])), priority:Math.min(3, i+1), kind:KIND[s] || 'expert'}))
  };
}
/* Fill anything the live run left missing, so the screen is always complete. */
function complete(text){
  if (!R.brief || !R.needs.length){ const a = localAnalyse(text); R.brief = R.brief || a.brief; if (!R.needs.length) R.needs = a.needs; }
  for (const n of R.needs){
    if (!R.pool[n.id]) R.pool[n.id] = retrieve(n, R.brief).map(x => x.e.id);
    const have = R.matches.filter(m => m.need_id === n.id).length;
    for (const id of R.pool[n.id]){
      if (R.matches.filter(m => m.need_id === n.id).length >= Math.max(2, have)) break;
      if (R.matches.some(m => m.need_id === n.id && m.expert_id === id)) continue;
      const e = byId(id); R.matches.push({need_id:n.id, expert_id:id, why:localWhy(e, n, R.brief), watch:localWatch(e, R.brief)});
    }
  }
  if (!R.summary) R.summary = T().localSummary(R.needs.length, R.matches.length);
  R.active = R.active || R.needs[0]?.id;
}

/* ---------------- Agent trace ---------------- */
function step(i, s){ R.steps[i].s = s; renderTrace() }
function log(i, html){ R.steps[i].logs.push(html); renderTrace() }
function renderTrace(){
  $('steps').innerHTML = R.steps.map((st,i) => `<li class="stepi ${st.s}"><span class="dot"></span><b>${esc(T().steps[i])}</b>${st.logs.length ? `<div class="logs">${st.logs.map(l => `<div class="log">${l}</div>`).join('')}</div>` : ''}</li>`).join('');
  $('traceMode').textContent = ai && !R.forceDemo ? T().traceLive : T().traceDemo;
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- Demo run (local rules, paced so the steps are readable) ---------------- */
async function runLocal(text){
  R.forceDemo = true;
  step(0,'run'); await wait(500);
  const a = localAnalyse(text); R.brief = a.brief;
  log(0, `<em>analyse</em>(text) → sector: <span>${a.brief.sector}</span>, region: <span>${a.brief.region}</span>`);
  step(0,'done'); renderResults(); step(1,'run'); await wait(600);
  R.needs = a.needs; R.active = a.needs[0].id;
  log(1, `needs → <span>${a.needs.map(n => n.skill).join(', ')}</span>`);
  step(1,'done'); renderResults(); step(2,'run');
  for (const n of R.needs){ await wait(380); const res = retrieve(n, R.brief); R.pool[n.id] = res.map(x => x.e.id); log(2, `<em>search_directory</em>({skill:"${n.skill}"}) → <span>${res.length} candidates</span>`) }
  step(2,'done'); step(3,'run'); await wait(550);
  complete(text); log(3, `<em>propose_matches</em> → <span>${R.matches.length} saved</span>`);
  step(3,'done'); step(4,'done'); renderResults();
}

"""${text.slice(0, 1200)}"""`;

   { name:'save_analysis',

       R.brief = {title:String(inp.title || '').slice(0,80), summary:String(inp.summary || '').slice(0,320), sector:SECTORS[inp.sector] ? inp.sector : 'crafts', stage:STAGES[inp.stage] ? inp.stage : 'early', region:REGIONS[inp.region] ? inp.region : 'unknown'};
       R.needs = needs; R.active = needs[0].id;

       return {needs: needs.map(n => ({need_id:n.id, skill:n.skill}))};

       const rejected = []; let saved = 0;
       for (const m of (Array.isArray(inp.matches) ? inp.matches : [])){
         const need = R.needs.find(n => n.id === String(m.need_id)), e = byId(String(m.expert_id));
         if (!need || !e || !(R.pool[need.id] || []).includes(e.id)) { rejected.push(m.expert_id); continue }
         if (R.matches.some(x => x.need_id === need.id && x.expert_id === e.id)) continue;
         R.matches.push({need_id:need.id, expert_id:e.id, why:String(m.why || '').slice(0,300), watch:String(m.watch_out || '').slice(0,220)}); saved++;
       }
       log(3, `<em>propose_matches</em> → <span>${saved} saved</span>${rejected.length ? `, ${rejected.length} rejected (not in results)` : ''}`);
       R.steps[3].s = 'done'; step(4,'run'); renderResults();
       return {saved, rejected};
     }}
  ];
}
async function runLive(text){
  step(0,'run');
  ctl = new AbortController();
  try {
    const res = await ai(agentPrompt(text), {tools:buildTools(), modelTier:$('deep').checked ? 'default' : 'quick', signal:ctl.signal});
    if (R.matches.length) R.summary = String(res.text || '').trim().split(/\n\s*\n/).pop().slice(0, 600);
  } catch (e) {
    if (e && e.code === 'cancelled') { R.banner = T().stopped; R.steps.forEach(s => { if (s.s === 'run') s.s = 'idle' }); if (!R.needs.length) { renderTrace(); renderResults(); return } }
    else {
      R.banner = T().fallback; R.forceDemo = true;
      if (e && ['tools_unavailable'].includes(e.code)) toolsOK = false;
      if (e && ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)) { ai = null; paintMode() }
      log(4, `fallback: <span>${esc(e && e.code || 'error')}</span>`);
    }
  }
  complete(text);
  R.steps.forEach(s => s.s = 'done'); renderTrace(); renderResults();
}

async function run(){
  const text = $('ask').value.trim();
  if (!text) { toast(T().emptyAsk); $('ask').focus(); return }
  if (running) return;
  running = true; R = freshRun(); R.text = text;
  $('work').classList.remove('hidden'); $('runBtn').disabled = true; $('runBtn').textContent = T().running;
  $('stopBtn').classList.toggle('hidden', !ai);
  renderTrace(); renderResults();
  $('work').scrollIntoView({behavior:'smooth', block:'start'});
  try { if (ai && toolsOK) await runLive(text); else await runLocal(text) }
  finally { running = false; ctl = null; $('runBtn').disabled = false; $('runBtn').textContent = T().run; $('stopBtn').classList.add('hidden') }
}

/* ---------------- Results ---------------- */
function matchCard(m, idx){
  const e = byId(m.expert_id), need = R.needs.find(n => n.id === m.need_id); if (!e || !need) return '';
  const f = fit(e, need, R.brief), done = requests.some(r => r.expert_id === e.id && r.run === R.text && r.need === need.title);
  const row = (label, v) => `<div class="fitrow"><div><span>${esc(label)}</span><b>${v}%</b></div><div class="track"><i style="width:${v}%"></i></div></div>`;
  return `<article class="mcard ${idx === 0 ? 'top' : ''}">
    <div>
      <div class="who"><div class="ava ${e.k === 'talent' ? 't' : ''}" aria-hidden="true">${esc(L(e.n).trim()[0])}</div>
        <div><h4>${esc(L(e.n))}</h4><div class="role">${esc(L(e.t))}</div>
          <div class="tags" style="margin-top:8px"><span class="tag ${e.k === 'talent' ? 'l' : 'o'}">${esc(T()[e.k])}</span><span class="tag dash">${esc(T().illus)}</span>${m.alt ? `<span class="tag">${esc(T().alt)}</span>` : ''}</div></div></div>
      <div class="why"><b>${esc(T().why)}</b><p>${esc(m.why)}</p></div>
      ${m.watch ? `<div class="watch"><b>${esc(T().watch)}</b>${esc(m.watch)}</div>` : ''}
      <div class="meta"><span>${esc(T().years(e.y))}</span><span>${esc(L(REGIONS[e.r]))}</span><span>${esc(L(MODES[e.m]))}</span><span>${esc(L(AVAIL[e.a]))}</span><span>${esc(L(e.f))}</span></div>
      <div class="mact"><button class="btn primary sm" data-intro="${e.id}" data-need="${need.id}" ${done ? 'disabled' : ''}>${esc(done ? T().requested : T().intro)}</button><button class="btn ghost sm" data-dismiss="${e.id}" data-need="${need.id}">${esc(T().notFit)}</button></div>
    </div>
    <div class="scorebox"><div class="ring" style="--p:${f.total}"><b>${f.total}<small>%</small></b></div>
      ${row(T().fitSkill, f.sk)}${row(T().fitSector, f.sec)}${row(T().fitPrac, f.prac)}
      <div class="scorenote">${esc(T().scoreNote)}</div></div>
  </article>`;
}
function renderResults(){
  const el = $('results'); let h = '';
  if (R.banner) h += `<div class="banner">${esc(R.banner)}</div>`;
  if (R.brief){
    const b = R.brief;
    h += `<section class="panel brief"><div class="eyebrow">${esc(T().briefTag)}</div><h2>${esc(b.title || L(SECTORS[b.sector]))}</h2><p>${esc(b.summary)}</p>
      <div class="tags"><span class="tag o">${esc(L(SECTORS[b.sector]))}</span><span class="tag l">${esc(L(STAGES[b.stage]))}</span>${b.region !== 'unknown' ? `<span class="tag">${esc(L(REGIONS[b.region]))}</span>` : ''}</div>
      ${R.summary ? `<p class="summary">${esc(R.summary)}</p>` : ''}</section>`;
  }
  if (R.needs.length){
    h += `<section><div class="sech"><h3>${esc(T().needsH)}</h3><span>${esc(T().needsHint)}</span></div><div class="needs">${R.needs.map(n =>
      `<button class="need ${R.active === n.id ? 'on' : ''}" data-need-pick="${n.id}" aria-pressed="${R.active === n.id}"><small>${esc(T().prio[n.priority])} · ${esc(L(SKILLS[n.skill]))}</small><h4>${esc(n.title)}</h4><p>${esc(n.why)}</p></button>`).join('')}</div></section>`;
    const need = R.needs.find(n => n.id === R.active) || R.needs[0];
    const ms = R.matches.filter(m => m.need_id === need.id).map(m => ({m, t:fit(byId(m.expert_id) || {s:[],c:[]}, need, R.brief).total})).sort((a,b) => b.t - a.t).map(x => x.m);
    h += `<section><div class="sech"><h3>${esc(T().matchesFor)} «${esc(need.title)}»</h3><span>${ms.length ? esc(T().matchCount(ms.length)) : ''}</span></div>
      <div class="matches">${ms.length ? ms.map(matchCard).join('') : `<div class="empty">${running ? '<span class="tag dash">…</span>' : esc(T().noMore)}</div>`}</div></section>`;
  }
  el.innerHTML = h;
}
$('results').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.needPick) { R.active = b.dataset.needPick; renderResults() }
  else if (b.dataset.dismiss) dismiss(b.dataset.need, b.dataset.dismiss);
  else if (b.dataset.intro) openIntro(b.dataset.need, b.dataset.intro);
});
/* Human in the loop: reject a match and get the next candidate from the same search. */
function dismiss(needId, expertId){
  const need = R.needs.find(n => n.id === needId);
  (R.dismissed[needId] ||= []).push(expertId);
  R.matches = R.matches.filter(m => !(m.need_id === needId && m.expert_id === expertId));
  const shown = R.matches.filter(m => m.need_id === needId).map(m => m.expert_id);
  const next = (R.pool[needId] || []).find(id => !shown.includes(id) && !R.dismissed[needId].includes(id));
  if (next) { const e = byId(next); R.matches.push({need_id:needId, expert_id:next, why:localWhy(e, need, R.brief), watch:localWatch(e, R.brief), alt:true}) }
  renderResults();
}

/* ---------------- Intro request drawer ---------------- */
let draft = null, draftCtl = null;
function openIntro(needId, expertId){
  const need = R.needs.find(n => n.id === needId), e = byId(expertId); if (!need || !e) return;
  draft = {need, e, agenda:T().tplAgenda(need.title)};
  const base = T().tplMsg(L(e.n), L(e.t), need.title, R.brief.summary);
  $('drawer').innerHTML = `<div class="eyebrow">${esc(T().dH)}</div><h2 style="font-size:24px">${esc(L(e.n))}</h2><p class="lead" style="font-size:14.5px">${esc(L(e.t))} · ${esc(T().forNeed)}: ${esc(need.title)}</p>
    <p class="note" style="margin:0" id="dState">${esc(ai ? T().drafting : T().dLead)}</p>
    <label for="dMsg" style="font-size:13px;color:var(--muted)">${esc(T().dMsg)}</label><textarea id="dMsg">${esc(base)}</textarea>
    <div><div style="font-size:13px;color:var(--muted);margin-bottom:6px">${esc(T().dAgenda)}</div><ol id="dAgenda">${draft.agenda.map(q => `<li>${esc(q)}</li>`).join('')}</ol></div>
    <div class="mact" style="margin-top:4px"><button class="btn primary sm" id="dSave">${esc(T().dSave)}</button><button class="btn ghost sm" id="dCopy">${esc(T().dCopy)}</button><button class="btn ghost sm" id="dClose">${esc(T().dClose)}</button></div>
    <p class="note" style="margin:0">${esc(T().dNote)}</p>`;
  $('drawer').classList.add('on'); $('scrim').classList.add('on'); $('drawer').setAttribute('aria-hidden','false');
  $('dClose').onclick = closeIntro;
  $('dCopy').onclick = async () => { try { await navigator.clipboard.writeText($('dMsg').value); toast(T().copied) } catch {} };
  $('dSave').onclick = () => {
    requests.unshift({id:Date.now(), expert_id:e.id, name:L(e.n), title:L(e.t), need:need.title, run:R.text, msg:$('dMsg').value, agenda:draft.agenda});
    store.set('sam_requests', requests); closeIntro(); renderResults(); renderRequests(); toast(T().saved);
  };
  if (ai) draftLive(need, e);
}
async function draftLive(need, e){
  draftCtl = new AbortController();
  try {
    const out = await ai.json(`Write an intro request from a cultural entrepreneur to an expert, in ${lang === 'ar' ? 'Arabic' : 'English'}.
Reply with only JSON: {"message": string, "questions": [string, string, string]}.
"message": warm, concrete, under 110 words, plain text with line breaks. Mention the project in one line, the specific need, why this person fits, and ask for a 20-minute intro call. No placeholders, no subject line, sign off without a name.
"questions": three short questions the entrepreneur should ask in the first session, specific to this need.

Project: ${R.brief.title}. ${R.brief.summary}
Entrepreneur's own words: ${R.text.slice(0, 500)}
Need: ${need.title} (${SKILLS[need.skill].en}). ${need.why}
Expert: ${L(e.n)}, ${L(e.t)}; ${e.y} years; skills: ${e.s.join(', ')}; format: ${L(e.f)}`, {modelTier:'quick', signal:draftCtl.signal});
    if (!draft || draft.e.id !== e.id || !$('dMsg')) return;
    if (out && typeof out.message === 'string' && out.message.trim()) $('dMsg').value = out.message.trim();
    if (out && Array.isArray(out.questions) && out.questions.length) { draft.agenda = out.questions.slice(0,3).map(String); $('dAgenda').innerHTML = draft.agenda.map(q => `<li>${esc(q)}</li>`).join('') }
  } catch {}
  if ($('dState')) $('dState').textContent = T().dLead;
}
function closeIntro(){ draftCtl?.abort(); draft = null; $('drawer').classList.remove('on'); $('scrim').classList.remove('on'); $('drawer').setAttribute('aria-hidden','true') }
$('scrim').onclick = closeIntro;
addEventListener('keydown', e => { if (e.key === 'Escape') closeIntro() });

/* ---------------- Requests ---------------- */
function renderRequests(){
  $('reqCount').textContent = requests.length; $('reqCount').classList.toggle('hidden', !requests.length);
  $('reqList').innerHTML = requests.length ? requests.map(r => `<div class="req"><div class="sech" style="margin:0"><h3 style="font-size:17px">${esc(r.name)} <span style="font-family:var(--body);font-weight:400">· ${esc(r.title)}</span></h3><button class="btn ghost sm" data-del="${r.id}">${esc(T().remove)}</button></div>
    <div class="tags" style="margin:0"><span class="tag o">${esc(T().forNeed)}: ${esc(r.need)}</span><span class="tag dash">${esc(T().reqStatus)}</span></div><pre>${esc(r.msg)}</pre></div>`).join('') : `<div class="empty">${esc(T().reqEmpty)}</div>`;
}
$('reqList').addEventListener('click', ev => { const b = ev.target.closest('[data-del]'); if (!b) return; requests = requests.filter(r => String(r.id) !== b.dataset.del); store.set('sam_requests', requests); renderRequests(); if (R.brief) renderResults() });

/* ---------------- Directory ---------------- */
let jSel = {s:[], c:[]};
function renderDirectory(){
  const q = $('dq').value.trim().toLowerCase(), k = $('dkind').value, sk = $('dskill').value;
  const list = allExperts().filter(e => (!k || e.k === k) && (!sk || e.s.includes(sk)) && (!q || [e.n.ar,e.n.en,e.t.ar,e.t.en].concat(e.s.map(s => SKILLS[s].ar + ' ' + SKILLS[s].en)).join(' ').toLowerCase().includes(q)));
  $('dir').innerHTML = list.map(e => `<div class="dcard"><div class="who"><div class="ava ${e.k === 'talent' ? 't' : ''}" aria-hidden="true">${esc(L(e.n).trim()[0])}</div><div><h4>${esc(L(e.n))}</h4><div class="role" style="font-size:13.5px">${esc(L(e.t))}</div></div></div>
    <div class="tags" style="margin:0">${e.s.map(s => `<span class="tag ${e.k === 'talent' ? 'l' : 'o'}">${esc(L(SKILLS[s]))}</span>`).join('')}</div>
    <p>${esc(T().years(e.y))} · ${esc(L(REGIONS[e.r]))} · ${esc(L(MODES[e.m]))}<br>${esc(e.c.includes('all') ? T().any : e.c.map(c => L(SECTORS[c])).join(lang === 'ar' ? '، ' : ', '))}</p>
    <div class="tags" style="margin:0;margin-top:auto"><span class="tag">${esc(T()[e.k])}</span><span class="tag dash">${esc(e.own ? T().added : T().illus)}</span>${e.own ? `<button class="chipbtn" data-rm="${e.id}">${esc(T().remove)}</button>` : ''}</div></div>`).join('') || `<div class="empty">—</div>`;
}
function fillSelects(){
  const opt = (v, t, sel) => `<option value="${v}" ${sel === v ? 'selected' : ''}>${esc(t)}</option>`;
  const k = $('dkind').value, s = $('dskill').value;
  $('dkind').innerHTML = opt('', T().allKinds, k) + opt('expert', T().expert, k) + opt('talent', T().talent, k);
  $('dskill').innerHTML = opt('', T().allSkills, s) + Object.entries(SKILLS).map(([key, v]) => opt(key, L(v), s)).join('');
  $('jKind').innerHTML = opt('expert', T().expert) + opt('talent', T().talent);
  $('jRegion').innerHTML = Object.entries(REGIONS).map(([key, v]) => opt(key, L(v))).join('');
  const pick = (map, arr, attr) => Object.entries(map).map(([key, v]) => `<button type="button" class="${arr.includes(key) ? 'on' : ''}" data-${attr}="${key}" aria-pressed="${arr.includes(key)}">${esc(L(v))}</button>`).join('');
  $('jSkills').innerHTML = pick(SKILLS, jSel.s, 'js'); $('jSectors').innerHTML = pick(SECTORS, jSel.c, 'jc');
}
['dq','dkind','dskill'].forEach(id => $(id).addEventListener('input', renderDirectory));
$('joinToggle').onclick = () => $('joinPanel').classList.toggle('hidden');
$('joinPanel').addEventListener('click', ev => {
  const b = ev.target.closest('[data-js],[data-jc]'); if (!b) return;
  const arr = b.dataset.js ? jSel.s : jSel.c, key = b.dataset.js || b.dataset.jc, i = arr.indexOf(key);
  if (i >= 0) arr.splice(i, 1); else if (arr.length < 3) arr.push(key);
  fillSelects();
});
$('joinForm').addEventListener('submit', ev => {
  ev.preventDefault();
  if (!jSel.s.length) { toast(T().joinNeed); return }
  const name = $('jName').value.trim(), title = $('jTitle').value.trim();
  extra.push({id:'u' + Date.now(), own:true, n:{ar:name,en:name}, k:$('jKind').value, t:{ar:title,en:title}, s:[...jSel.s], c:jSel.c.length ? [...jSel.c] : ['all'], r:$('jRegion').value, m:'hybrid', a:3, y:5, f:{ar:'حسب الاتفاق',en:'By agreement'}});
  store.set('sam_extra', extra); jSel = {s:[], c:[]}; ev.target.reset(); fillSelects(); $('joinPanel').classList.add('hidden'); renderDirectory(); toast(T().joined);
});
$('dir').addEventListener('click', ev => { const b = ev.target.closest('[data-rm]'); if (!b) return; extra = extra.filter(e => e.id !== b.dataset.rm); store.set('sam_extra', extra); renderDirectory() });

/* ---------------- Static copy, language, tabs ---------------- */
function paintMode(){
  const live = !!ai;
  $('status').className = 'status ' + (live ? 'live' : 'demo'); $('statusTxt').textContent = live ? T().live : T().demo;
  $('modeNote').textContent = live ? T().noteLive : T().noteDemo; $('deepWrap').classList.toggle('hidden', !live);
}
function paint(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = T()[el.dataset.i] });
  $('langBtn').textContent = T().langBtn; $('ask').placeholder = T().askPh; $('dq').placeholder = T().dq;
  if (!running) $('runBtn').textContent = T().run;
  $('examples').innerHTML = T().ex.map((x, i) => `<button type="button" data-ex="${i}"><b>${esc(T().exLabel[i])}</b>${esc(x)}</button>`).join('');
  $('pipe').innerHTML = T().pipe.map(p => `<div class="pnode"><small>${p[0]}</small><h4>${esc(p[1])}</h4><p>${esc(p[2])}</p>${p[3] ? `<code>${p[3]}()</code>` : ''}</div>`).join('');
  $('techTable').innerHTML = `<thead><tr>${T().techHead.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${T().tech.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>`;
  $('stats').innerHTML = T().stats.map(s => `<div class="panel stat"><b class="grad">${esc(s[0])}</b><p>${esc(s[1])}</p><a href="${s[3]}" target="_blank" rel="noopener">${esc(T().source)}: ${esc(s[2])}</a></div>`).join('');
  $('rai').innerHTML = T().rai.map(r => `<div class="panel"><h3 style="font-size:17px">${esc(r[0])}</h3><p style="color:var(--muted);font-size:14.5px;margin-top:6px">${esc(r[1])}</p></div>`).join('');
  paintMode(); fillSelects(); renderDirectory(); renderRequests();
  if (!$('work').classList.contains('hidden')) { renderTrace(); renderResults() }
}
$('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; store.set('sam_lang', lang); closeIntro(); paint() };
$('examples').addEventListener('click', ev => { const b = ev.target.closest('[data-ex]'); if (!b) return; $('ask').value = T().ex[+b.dataset.ex]; $('ask').focus() });
$('runBtn').onclick = run;
$('stopBtn').onclick = () => ctl?.abort();
$('ask').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run() });
const VIEWS = ['match','directory','requests','how'];
function show(v){
  if (!VIEWS.includes(v)) v = 'match';
  VIEWS.forEach(x => $('v-' + x).classList.toggle('on', x === v));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
}
$('tabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; show(b.dataset.view); try { history.replaceState(null, '', '#' + b.dataset.view) } catch {} scrollTo({top:0}) });
addEventListener('hashchange', () => show(location.hash.slice(1)));
let toastT; function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400) }

/* ---------------- Capabilities: live Claude and voice input, when the host offers them ---------------- */
async function connect(){
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const s = await window.claude.use('sample');
    if (s) { ai = s; try { const lim = await s.limits(); toolsOK = !!lim.tools } catch { toolsOK = true } paintMode() }
  } catch {}
  try {
    const d = await window.claude.use('dictation');
    if (d) {
      dict = d; let listening = false, base = '';
      $('mic').classList.remove('hidden');
      d.onPartial(({text}) => { $('ask').value = (base + ' ' + text).trim() });
      d.onFinal(({text}) => { base = (base + ' ' + text).trim(); $('ask').value = base });
      d.onState(({state}) => { listening = state === 'listening'; $('mic').classList.toggle('rec', listening) });
      $('mic').onclick = () => { if (listening) { d.stop().catch(() => {}) } else { base = $('ask').value.trim(); d.start().catch(e => { if (e && e.code === 'not_granted') $('mic').classList.add('hidden') }) } };
    }
  } catch {}
}

paint(); show(location.hash.slice(1)); connect();
</script>
